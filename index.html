<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>시군구 마스터</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Black+Han+Sans&display=swap');
:root{
  --bg:#f0f4f8;--sf:#fff;--sf2:#f8fafc;--bd:#e2e8f0;
  --ac:#2563eb;--ac2:#f59e0b;--ok:#16a34a;--no:#dc2626;
  --tx:#1e293b;--tx2:#64748b;--sea:#bfdbfe;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--tx);}
.screen{display:none;position:fixed;inset:0;overflow:hidden;}
.screen.active{display:flex;flex-direction:column;}

/* ── INTRO ── */
#si{align-items:center;justify-content:center;background:linear-gradient(160deg,#eff6ff,#f0f4f8);padding:.8rem;}
.iw{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:.55rem;}
.ititle{font-family:'Black Han Sans',sans-serif;font-size:clamp(1.9rem,9vw,3rem);
  background:linear-gradient(135deg,#1d4ed8,#7c3aed,#059669);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1;text-align:center;}
.isub{font-size:.75rem;color:var(--tx2);text-align:center;}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.32rem;width:100%;}
.rbtn{background:var(--sf);border:1.5px solid var(--bd);color:var(--tx);
  padding:.42rem .2rem;border-radius:8px;cursor:pointer;
  font-size:.7rem;font-family:'Noto Sans KR',sans-serif;font-weight:500;
  -webkit-appearance:none;text-align:center;line-height:1.25;}
.rbtn .rc{display:block;font-size:.52rem;color:var(--tx2);}
.rbtn.sel,.rbtn:active{border-color:var(--ac);background:#eff6ff;color:var(--ac);}
.rbtn.all{grid-column:1/-1;padding:.5rem;border-color:var(--ac);
  background:linear-gradient(135deg,#eff6ff,#f5f3ff);
  font-size:.82rem;font-family:'Black Han Sans',sans-serif;color:var(--ac);}
.sbtn{background:linear-gradient(135deg,var(--ac),#1d4ed8);color:#fff;border:none;
  padding:.72rem 2rem;border-radius:99px;font-size:.92rem;font-weight:700;
  cursor:pointer;font-family:'Noto Sans KR',sans-serif;-webkit-appearance:none;
  box-shadow:0 4px 12px rgba(37,99,235,.3);width:100%;}
.sbtn:active{transform:scale(.97);}
.sbtn:disabled{opacity:.35;cursor:not-allowed;}

/* ── GAME: 스크롤 가능 ── */
#sg{background:var(--bg);overflow-y:auto;}

.hud{display:flex;align-items:center;gap:.38rem;padding:.42rem .65rem;
  background:var(--sf);border-bottom:1.5px solid var(--bd);flex-shrink:0;}
.pass-btn{display:flex;align-items:center;gap:.18rem;background:#fefce8;
  border:1.5px solid #fde68a;color:#92400e;padding:.25rem .42rem;
  border-radius:7px;cursor:pointer;font-size:.62rem;
  font-family:'Noto Sans KR',sans-serif;font-weight:600;
  -webkit-appearance:none;white-space:nowrap;}
.pass-btn:active{background:#fef3c7;}
.pass-btn.warn{background:#fff7ed;border-color:#fed7aa;color:#c2410c;}
.pass-btn.empty{opacity:.35;cursor:not-allowed;}
.hud-m{flex:1;text-align:center;min-width:0;}
.hud-n{font-family:'Black Han Sans',sans-serif;font-size:.9rem;color:var(--tx);}
.hud-bar{height:3px;background:var(--bd);border-radius:99px;margin-top:2px;overflow:hidden;}
.hud-f{height:100%;background:linear-gradient(90deg,var(--ac),#7c3aed);border-radius:99px;transition:width .4s;}
.hud-s{font-size:.62rem;color:var(--tx2);white-space:nowrap;}
.hud-s strong{color:var(--ok);}
.hbtn{background:var(--sf2);border:1.5px solid var(--bd);color:var(--tx2);
  padding:.25rem .42rem;border-radius:7px;cursor:pointer;font-size:.62rem;
  font-family:'Noto Sans KR',sans-serif;-webkit-appearance:none;white-space:nowrap;}
.hbtn:active{background:var(--bd);}

/* 지도: flex-shrink 0, 고정높이 비율 */
.map-wrap{background:var(--sea);border-bottom:1.5px solid var(--bd);
  flex-shrink:0;padding:.45rem;}
.plabel{font-size:.55rem;color:#1e40af;letter-spacing:.08em;
  text-transform:uppercase;margin-bottom:.3rem;font-weight:600;}
#mapwrap{position:relative;}
#mapwrap svg{display:block;width:100%;height:auto;border-radius:5px;
  box-shadow:0 1px 5px rgba(0,0,0,.1);}
/* 인셋 박스 */
.inset-box{position:absolute;bottom:4px;right:4px;
  background:rgba(255,255,255,.9);border:1.5px solid var(--bd);
  border-radius:5px;padding:2px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;}
.inset-box svg{display:block;border-radius:2px;}
.inset-lbl{font-size:8px;color:var(--tx2);font-weight:500;line-height:1;}

/* 선택지 */
.cho-wrap{padding:.42rem .65rem;flex-shrink:0;}
.qt{font-size:.78rem;font-weight:700;margin-bottom:.38rem;line-height:1.3;color:var(--tx);}
.cgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.28rem;}
.cb{background:var(--sf);border:2px solid var(--bd);color:var(--tx);
  padding:.42rem .5rem;border-radius:8px;cursor:pointer;font-size:.76rem;
  font-family:'Noto Sans KR',sans-serif;font-weight:500;text-align:left;
  display:flex;align-items:center;gap:.35rem;-webkit-appearance:none;}
.cb:active:not(:disabled){border-color:var(--ac);background:#eff6ff;}
.cn{width:17px;height:17px;border-radius:50%;background:var(--bd);
  display:flex;align-items:center;justify-content:center;
  font-size:.53rem;font-weight:700;flex-shrink:0;color:var(--tx2);}
.cb.ok{border-color:var(--ok);background:#f0fdf4;}
.cb.ok .cn{background:var(--ok);color:#fff;}
.cb.ng{border-color:var(--no);background:#fef2f2;animation:shk .3s;}
.cb.ng .cn{background:var(--no);color:#fff;}
.cb.pr{border-color:var(--ac2);background:#fffbeb;}
.cb.pr .cn{background:var(--ac2);color:#000;}
.cb:disabled{cursor:default;}
@keyframes shk{0%,100%{transform:translateX(0)}33%{transform:translateX(-3px)}66%{transform:translateX(3px)}}

/* 힌트: 아코디언, overflow hidden으로 한화면 유지 */
.hint-wrap{padding:0 .65rem .5rem;flex-shrink:0;}
.htog{width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:.5rem .65rem;background:var(--sf);border:1.5px solid var(--bd);
  border-radius:8px;cursor:pointer;font-size:.72rem;color:var(--tx);
  font-family:'Noto Sans KR',sans-serif;font-weight:500;-webkit-appearance:none;}
.htog:active{background:var(--sf2);}
.harr{color:var(--tx2);font-size:.58rem;transition:transform .22s;}
.htog.open .harr{transform:rotate(180deg);}
/* 힌트 패널: position absolute로 floating */
.hint-panel{
  position:fixed;left:0;right:0;bottom:0;
  background:var(--sf);border-top:2px solid var(--bd);
  border-radius:14px 14px 0 0;
  padding:.6rem .65rem .75rem;
  box-shadow:0 -4px 20px rgba(0,0,0,.12);
  transform:translateY(100%);transition:transform .28s ease;
  z-index:100;max-height:55vh;overflow-y:auto;
}
.hint-panel.open{transform:translateY(0);}
.hint-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.45rem;}
.hint-panel-title{font-size:.75rem;font-weight:700;color:var(--tx);}
.hint-close{background:var(--sf2);border:1.5px solid var(--bd);color:var(--tx2);
  padding:.22rem .5rem;border-radius:6px;cursor:pointer;font-size:.65rem;
  font-family:'Noto Sans KR',sans-serif;-webkit-appearance:none;}
.hinner{display:flex;flex-direction:column;gap:.28rem;}
.ni{background:var(--sf2);border:1.5px solid var(--bd);border-left:3px solid var(--ac2);
  border-radius:7px;padding:.42rem .55rem;font-size:.72rem;line-height:1.5;color:var(--tx);}
.ns{font-size:.6rem;color:var(--ac);font-weight:700;margin-bottom:.1rem;}

/* 배너 */
.banner{position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(.5);
  background:var(--sf);border:2px solid var(--ok);border-radius:14px;
  padding:1.2rem 1.5rem;text-align:center;z-index:500;opacity:0;
  transition:all .2s;pointer-events:none;min-width:170px;
  box-shadow:0 8px 24px rgba(0,0,0,.15);}
.banner.show{transform:translate(-50%,-50%) scale(1);opacity:1;}
.banner.ng{border-color:var(--no);}
.banner.pass{border-color:var(--ac2);}
.bi{font-size:2rem;margin-bottom:.2rem;}
.bt{font-size:.95rem;font-weight:700;color:var(--tx);}
.bs{font-size:.72rem;color:var(--tx2);margin-top:.1rem;}

/* OVER/CLEAR */
#sgo,#scl{align-items:center;justify-content:center;overflow-y:auto;}
#sgo{background:linear-gradient(160deg,#fef2f2,#f0f4f8);}
#scl{background:linear-gradient(160deg,#f0fdf4,#f0f4f8);}
.gow{text-align:center;padding:1.8rem 1.2rem;}
.goico{font-size:3.2rem;margin-bottom:.5rem;animation:fl 2s ease-in-out infinite;}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.gotit{font-family:'Black Han Sans',sans-serif;font-size:2.3rem;color:var(--no);margin-bottom:.3rem;}
.cltit{font-family:'Black Han Sans',sans-serif;font-size:2.3rem;color:var(--ok);margin-bottom:.3rem;}
.gobox{background:var(--sf);border:1.5px solid var(--bd);border-radius:10px;
  padding:.75rem 1.5rem;margin:.9rem auto;max-width:290px;}
.gol{font-size:.65rem;color:var(--tx2);margin-bottom:.15rem;}
.gov{font-size:1.25rem;font-weight:700;color:var(--ac);}
.gost{font-size:.85rem;color:var(--tx2);margin-bottom:1.2rem;}
.gost strong{color:var(--tx);font-size:1.05rem;}
.gobtns{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;}
.gbtn{padding:.65rem 1.3rem;border-radius:99px;font-size:.82rem;
  font-family:'Noto Sans KR',sans-serif;font-weight:700;cursor:pointer;border:none;-webkit-appearance:none;}
.gbtn.re{background:linear-gradient(135deg,var(--ac),#1d4ed8);color:#fff;}
.gbtn.ho{background:var(--sf);border:1.5px solid var(--bd);color:var(--tx);}
.gbtn:active{transform:scale(.96);}
</style>
</head>
<body>

<!-- INTRO -->
<div id="si" class="screen active">
  <div class="iw">
    <div class="ititle">🗺️ 시군구 마스터</div>
    <div class="isub">전국 229개 시군구를 모두 아시나요?</div>
    <div class="rgrid" id="rgrid">
      <button class="rbtn all" data-r="all" onclick="selR(this)">🇰🇷 전국 도전<span class="rc">229개 전체</span></button>
    </div>
    <button class="sbtn" id="sbtn" onclick="startGame()" disabled>지역을 선택하세요</button>
  </div>
  <div style="position:absolute;bottom:1rem;left:0;right:0;text-align:center;
    font-size:.65rem;color:#94a3b8;letter-spacing:.04em;">
    © 2025 Kichan Nam · 시군구 마스터
  </div>
</div>

<!-- GAME -->
<div id="sg" class="screen">
  <div class="hud">
    <button class="pass-btn" id="passbtn" onclick="usePass()">⏭ 패스 <span id="passcnt">5</span></button>
    <div class="hud-m">
      <div class="hud-n" id="hcnt">1/229</div>
      <div class="hud-bar"><div class="hud-f" id="hfill" style="width:0%"></div></div>
    </div>
    <div class="hud-s">🔥<strong id="hstr">0</strong></div>
    <button class="hbtn" onclick="goHome()">🏠 홈</button>
  </div>
  <div class="map-wrap">
    <div class="plabel">📍 ★ 표시된 시군구를 맞추세요</div>
    <div id="mapwrap"></div>
  </div>
  <div class="cho-wrap">
    <div class="qt" id="qtxt">시군구 이름을 선택하세요</div>
    <div class="cgrid" id="cgrid"></div>
  </div>
  <div class="hint-wrap">
    <button class="htog" id="htog" onclick="togHint()">
      <span>💡 힌트 보기</span><span class="harr">▼</span>
    </button>
  </div>
</div>

<!-- 힌트 패널 (floating) -->
<div class="hint-panel" id="hint-panel">
  <div class="hint-panel-head">
    <div class="hint-panel-title">💡 힌트</div>
    <button class="hint-close" onclick="togHint()">닫기 ✕</button>
  </div>
  <div class="hinner" id="hinner"></div>
</div>

<!-- GAME OVER -->
<div id="sgo" class="screen">
  <div class="gow">
    <div class="goico">💀</div>
    <div class="gotit">GAME OVER</div>
    <div class="gobox"><div class="gol">정답은</div><div class="gov" id="gans"></div></div>
    <div class="gost"><strong id="gscr">0</strong>개 연속 정답<br><span id="gprog" style="font-size:.73rem"></span></div>
    <div class="gobtns">
      <button class="gbtn re" onclick="retry()">🔄 다시 도전</button>
      <button class="gbtn ho" onclick="goHome()">🏠 처음으로</button>
    </div>
  </div>
</div>

<!-- CLEAR -->
<div id="scl" class="screen">
  <div class="gow">
    <div class="goico" style="animation:none">🏆</div>
    <div class="cltit">완전 정복!</div>
    <p style="color:var(--tx2);margin:.7rem 0;font-size:.88rem">모든 시군구를 맞추셨습니다!</p>
    <div class="gobtns" style="margin-top:1.2rem">
      <button class="gbtn re" onclick="retry()">🔄 다시 도전</button>
      <button class="gbtn ho" onclick="goHome()">🏠 처음으로</button>
    </div>
  </div>
</div>

<div class="banner" id="banner">
  <div class="bi" id="bi">✅</div>
  <div class="bt" id="bt">정답!</div>
  <div class="bs" id="bs"></div>
</div>

  '강원특별자치도':'#06b6d4','충청북도':'#a78bfa','충청남도':'#fb923c',
  '전북특별자치도':'#6366f1','전라남도':'#22c55e','경상북도':'#f43f5e',
  '경상남도':'#14b8a6','제주특별자치도':'#eab308'
};

// 인셋으로 분리할 시군구: 본 지도 bbox에서 제외, 별도 박스에 표시
// vx/vy/vw/vh = 원본 좌표계에서의 위치 (인셋 SVG용)
const INSETS={
  // viewBox를 centroid 중심으로 설정 → 별이 항상 박스 중앙에 표시됨
  '인천광역시|옹진군':{vx:-200,vy:-2,vw:426,vh:301},
  '경상북도|울릉군':{vx:971,vy:234,vw:33,vh:31}
};

const MAX_PASS=5;
let selR_val=null,gList=[],gIdx=0,streak=0,locked=false,hOpen=false,passLeft=MAX_PASS;

(function(){
  const g=document.getElementById('rgrid');
  [...new Set(ALL.map(s=>s.sido))].forEach(sido=>{
    const cnt=ALL.filter(s=>s.sido===sido).length;
    const sh=SS[sido]||sido.slice(0,2);
    const b=document.createElement('button');
    b.className='rbtn';b.dataset.r=sido;
    b.innerHTML=sh+'<span class="rc">'+cnt+'개</span>';
    b.onclick=()=>selR(b);g.appendChild(b);
  });
})();

function selR(b){
  document.querySelectorAll('.rbtn').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel');
  selR_val=b.dataset.r==='all'?null:b.dataset.r;
  const sb=document.getElementById('sbtn');
  sb.textContent='🚀 '+(selR_val?SS[selR_val]||selR_val:'전국')+' 시작!';
  sb.disabled=false;
}
function startGame(){
  const pool=selR_val?ALL.filter(s=>s.sido===selR_val):[...ALL];
  gList=shuffle(pool);gIdx=0;streak=0;passLeft=MAX_PASS;
  updPass();showScreen('sg');nextQ();
}
function retry(){startGame();}
function goHome(){
  if(hOpen)togHint();
  selR_val=null;
  document.querySelectorAll('.rbtn').forEach(b=>b.classList.remove('sel'));
  document.getElementById('sbtn').textContent='지역을 선택하세요';
  document.getElementById('sbtn').disabled=true;
  showScreen('si');
}

function updPass(){
  const btn=document.getElementById('passbtn');
  document.getElementById('passcnt').textContent=passLeft;
  btn.className='pass-btn'+(passLeft===0?' empty':passLeft<=2?' warn':'');
}
function usePass(){
  if(locked||passLeft<=0)return;
  passLeft--;updPass();locked=true;
  document.querySelectorAll('.cb').forEach(b=>b.disabled=true);
  const t=gList[gIdx];
  document.querySelectorAll('.cb').forEach(b=>{if(b.textContent.trim().slice(1)===t.sgg)b.classList.add('pr');});
  showBanner('pass',t.sgg);gIdx++;
  setTimeout(()=>{hideBanner();if(hOpen)togHint();nextQ();},1800);
}

function nextQ(){
  if(gIdx>=gList.length){showScreen('scl');return;}
  locked=false;
  if(hOpen)togHint();
  const t=gList[gIdx];
  updHUD();buildChoices(t);drawMap(t);loadHints(t);
}
function updHUD(){
  const tot=gList.length;
  document.getElementById('hcnt').textContent=Math.min(gIdx+1,tot)+'/'+tot;
  document.getElementById('hfill').style.width=(gIdx/tot*100)+'%';
  document.getElementById('hstr').textContent=streak;
  updPass();
}

// 힌트 패널: floating (화면 위에 올라옴)
function togHint(){
  hOpen=!hOpen;
  document.getElementById('hint-panel').classList.toggle('open',hOpen);
  document.getElementById('htog').classList.toggle('open',hOpen);
}
function loadHints(t){
  const key=t.sido+'|'+t.sgg;
  const items=HINTS[key]||[{icon:'💡',keyword:'힌트',text:t.sido+' 소속 시군구입니다.'}];
  document.getElementById('hinner').innerHTML=
    items.slice(0,3).map(it=>
      '<div class="ni"><div class="ns">'+it.icon+' '+it.keyword+'</div>'+it.text+'</div>'
    ).join('');
}

// 지도
function drawMap(t){
  const wrap=document.getElementById('mapwrap');
  const color=SC[t.sido]||'#3b82f6';
  const bb=SIDO_BBOX[t.sido];
  const td=MAP_DATA[t.sido][t.sgg];
  const insetKey=t.sido+'|'+t.sgg;
  const isInset=insetKey in INSETS;

  const sidoW=bb[2]-bb[0],sidoH=bb[3]-bb[1];
  const pad=Math.min(sidoW,sidoH)*0.08;
  const vx=Math.max(0,bb[0]-pad),vy=Math.max(0,bb[1]-pad);
  const vw=Math.min(VW,bb[2]+pad)-vx,vh=Math.min(VH,bb[3]+pad)-vy;

  // ★ 크기: sgg bbox와 viewBox 크기 모두 반영
  // viewBox_shorter 의 2.5% 이하 + sgg_shorter의 18% 이하 → 둘 중 작은값
  const sggShort=Math.min(td.bw,td.bh);
  const viewShort=Math.min(vw,vh);
  const starR=Math.max(2,Math.min(sggShort*0.18,viewShort*0.025,9));
  const starFont=Math.max(4,Math.min(starR*1.9,18));

  let paths='';
  for(const [sido,sggs] of Object.entries(MAP_DATA)){
    const isCur=sido===t.sido;
    const c2=SC[sido]||'#3b82f6';
    for(const [sgg,d] of Object.entries(sggs)){
      const isT=isCur&&sgg===t.sgg;
      if((sido+'|'+sgg) in INSETS)continue;
      if(isT) paths+='<path d="'+d.p+'" fill="'+color+'" stroke="white" stroke-width="1" filter="url(#gl)"/>';
      else if(isCur) paths+='<path d="'+d.p+'" fill="'+color+'33" stroke="'+color+'77" stroke-width="0.6"/>';
      else paths+='<path d="'+d.p+'" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.35"/>';
    }
  }

  let star='';
  if(!isInset){
    star=
      '<circle cx="'+td.cx+'" cy="'+td.cy+'" r="'+starR*1.7+'" fill="none" stroke="'+color+'" stroke-width="0.8" opacity="0.6">'+
        '<animate attributeName="r" values="'+starR+';'+(starR*1.9)+';'+starR+'" dur="2s" repeatCount="indefinite"/>'+
        '<animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>'+
      '</circle>'+
      '<text x="'+td.cx+'" y="'+(td.cy+starFont*0.36)+'" text-anchor="middle" font-size="'+starFont+
        '" fill="white" paint-order="stroke" stroke="rgba(0,0,0,0.65)" stroke-width="'+Math.max(1,starFont*0.18)+
        '" font-family="sans-serif">&#9733;</text>';
  }

  // 시도명 뱃지: fs = viewBox짧은변의 2%, clamp(2.5,6)
  const fs=Math.max(2.5,Math.min(6,viewShort*0.02));
  const lp=fs*0.5,rp=fs*0.5,tp=fs*0.35,bp=fs*0.25;
  const shortName=SS[t.sido]||t.sido.slice(0,2);
  const bw2=shortName.length*fs*0.98+lp+rp;
  const bh=fs+tp+bp;
  const bx=vx+fs*0.4,by2=vy+fs*0.4;
  const badge=
    '<rect x="'+bx.toFixed(1)+'" y="'+by2.toFixed(1)+'" width="'+bw2.toFixed(1)+'" height="'+bh.toFixed(1)+
      '" rx="'+(bh*0.28).toFixed(1)+'" fill="'+color+'25" stroke="'+color+'70" stroke-width="0.5"/>'+
    '<text x="'+(bx+lp).toFixed(1)+'" y="'+(by2+tp+fs*0.88).toFixed(1)+
      '" font-size="'+fs.toFixed(1)+'" fill="'+color+'" font-family="Noto Sans KR,sans-serif" font-weight="700">'+shortName+'</text>';

  const stdDev=Math.max(1,starR*0.45);
  const defs='<defs><filter id="gl" x="-60%" y="-60%" width="220%" height="220%">'+
    '<feGaussianBlur in="SourceGraphic" stdDeviation="'+stdDev+'" result="b"/>'+
    '<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';

  wrap.innerHTML=
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+vx+' '+vy+' '+vw+' '+vh+'"'+
      ' preserveAspectRatio="xMidYMid meet"'+
      ' style="display:block;width:100%;height:auto;border-radius:5px;background:#bfdbfe">'+
      defs+'<rect x="'+vx+'" y="'+vy+'" width="'+vw+'" height="'+vh+'" fill="#bfdbfe"/>'+
      paths+star+badge+'</svg>';

  buildInsets(wrap,t,color);
}

function buildInsets(wrap,t,color){
  const sidoInsets=Object.keys(INSETS).filter(k=>k.startsWith(t.sido+'|'));
  if(!sidoInsets.length)return;

  const box=document.createElement('div');
  box.className='inset-box';

  sidoInsets.forEach(key=>{
    const [sido,sgg]=key.split('|');
    const d=MAP_DATA[sido]&&MAP_DATA[sido][sgg];
    if(!d)return;
    const inf=INSETS[key];
    const isT=t.sido===sido&&t.sgg===sgg;
    const c2=SC[sido]||color;

    const iW=64,iH=44;
    const sggShort=Math.min(d.bw,d.bh);
    const vs=Math.min(inf.vw,inf.vh);
    const sr=Math.max(2,Math.min(sggShort*0.18,vs*0.05,8));
    const sf=Math.max(4,Math.min(sr*1.9,14));

    let content='<path d="'+d.p+'" fill="'+(isT?c2:c2+'33')+'" stroke="'+(isT?'white':c2+'70')+'" stroke-width="'+(isT?0.8:0.4)+'"/>';
    if(isT){
      content+=
        '<text x="'+d.cx+'" y="'+(d.cy+sf*0.36)+'" text-anchor="middle" font-size="'+sf+
          '" fill="white" paint-order="stroke" stroke="rgba(0,0,0,0.6)" stroke-width="1.2" font-family="sans-serif">&#9733;</text>';
    }

    // 라벨 없음 - 지명 안 보이게
    box.innerHTML+=
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+inf.vx+' '+inf.vy+' '+inf.vw+' '+inf.vh+'"'+
        ' width="'+iW+'" height="'+iH+'" style="background:#bfdbfe;border-radius:2px">'+
        '<rect x="'+inf.vx+'" y="'+inf.vy+'" width="'+inf.vw+'" height="'+inf.vh+'" fill="#bfdbfe"/>'+
        content+'</svg>';
  });

  wrap.appendChild(box);
}

function buildChoices(t){
  const g=document.getElementById('cgrid');g.innerHTML='';
  const pool=ALL.filter(s=>s.sido===t.sido&&s.sgg!==t.sgg).map(s=>s.sgg);
  // 같은 시도 내 시군구 수에 따라 보기 수 결정 (최대 6개)
  const total=pool.length+1; // 정답 포함
  const cnt=Math.min(6,total);
  const wrongs=shuffle(pool).slice(0,cnt-1);
  const opts=shuffle([t.sgg,...wrongs]);
  ['①','②','③','④','⑤','⑥'].slice(0,cnt).forEach((n,i)=>{
    const b=document.createElement('button');
    b.className='cb';
    b.innerHTML='<span class="cn">'+n+'</span>'+opts[i];
    b.onclick=()=>pick(b,opts[i]===t.sgg,t);
    g.appendChild(b);
  });
  document.getElementById('qtxt').textContent=(SS[t.sido]||t.sido)+'의 ★ 시군구는?';
}

function pick(btn,ok,t){
  if(locked)return;locked=true;
  document.querySelectorAll('.cb').forEach(b=>b.disabled=true);
  if(ok){
    btn.classList.add('ok');streak++;
    showBanner('ok',t.sgg);gIdx++;
    setTimeout(()=>{hideBanner();if(hOpen)togHint();nextQ();},1300);
  }else{
    btn.classList.add('ng');
    document.querySelectorAll('.cb').forEach(b=>{if(b.textContent.trim().slice(1)===t.sgg)b.classList.add('ok');});
    showBanner('ng',t.sgg);
    setTimeout(()=>{
      hideBanner();if(hOpen)togHint();
      document.getElementById('gans').textContent=t.sido+' '+t.sgg;
      document.getElementById('gscr').textContent=streak;
      document.getElementById('gprog').textContent=(gIdx+1)+'번째 / 총 '+gList.length+'개';
      showScreen('sgo');
    },2000);
  }
}
function showBanner(type,name){
  const b=document.getElementById('banner');
  const icons={ok:'✅',ng:'❌',pass:'⏭'};
  const texts={ok:'정답! "'+name+'"',ng:'틀렸어요!',pass:'패스!'};
  const subs={ok:'연속 '+streak+'개!',ng:'정답: "'+name+'"',pass:'정답: "'+name+'" | 남은 '+passLeft+'회'};
  document.getElementById('bi').textContent=icons[type];
  document.getElementById('bt').textContent=texts[type];
  document.getElementById('bs').textContent=subs[type];
  b.className='banner show'+(type==='ng'?' ng':type==='pass'?' pass':'');
}
function hideBanner(){document.getElementById('banner').className='banner';}
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
</script></body></html>
